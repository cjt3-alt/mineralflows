name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # The ETL is not built or deployed, but it writes the files the app loads, so a
  # broken pipeline is a broken repo. Checked here rather than only in the
  # monthly refresh, where a regression would sit unnoticed for weeks.
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - run: pip install -r etl/requirements.txt

      - name: Lint
        run: |
          python -m ruff check etl/
          python -m ruff format --check etl/

      - name: Test
        run: python etl/test_pipeline.py

      - name: Check the fallback path still produces a valid dataset
        # The bare-runner case: no network, no drops. It still has to produce a
        # dataset that passes validation, so a source outage degrades to the seed
        # rather than breaking the site.
        #
        # --dry-run, not --check. public/data is a full run against live and
        # manual sources, which this runner cannot reproduce, so comparing the
        # two would always fail. Drift in the committed data is caught by
        # refresh-data.yml instead, which re-runs the full pipeline monthly and
        # opens a PR with any difference.
        run: python etl/pipeline.py --offline --no-manual --dry-run

  deploy:
    needs: [build, etl]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
